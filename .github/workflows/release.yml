# On a version tag (v1.2.3): build for Linux, macOS and Windows, and attach an archive for each to a
# GitHub release: the program, the themes, the examples, that platform's installer and the documents.
# The tag is the version in Cargo.toml; the release notes are its section of CHANGELOG.md.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # the tag names the version Cargo.toml has, CHANGELOG.md has a section for it, and the tests passed on it
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The tag, Cargo.toml and CHANGELOG.md agree
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          test "$GITHUB_REF_NAME" = "v$version" || { echo "tag $GITHUB_REF_NAME, Cargo.toml $version"; exit 1; }
          grep -q "^## $GITHUB_REF_NAME\b" CHANGELOG.md || { echo "no ## $GITHUB_REF_NAME in CHANGELOG.md"; exit 1; }
      - name: The tagged commit passed the tests
        env:
          GH_TOKEN: ${{ github.token }}
        # waits for a run still going (a tag pushed with its commit), up to an hour
        run: |
          runs() { gh run list --repo "$GITHUB_REPOSITORY" --workflow test.yml --commit "$GITHUB_SHA" --json status,conclusion --jq "$1"; }
          for i in $(seq 60); do
            test "$(runs '[.[] | select(.conclusion == "success")] | length')" -gt 0 && exit 0
            # none running: done, unless the tag's own run is not listed yet (the first minutes)
            test "$(runs '[.[] | select(.status != "completed")] | length')" -gt 0 || test "$i" -le 5 || break
            sleep 60
          done
          echo "the test workflow has not passed on $GITHUB_SHA: tag a commit whose tests pass, then run this again"
          exit 1

  linux:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # in Ubuntu 22.04, for its glibc (2.35): the binary runs there, on Debian 12 and on anything newer
      - run: docker run --rm -v "$PWD:/src" -w /src ubuntu:22.04 ci/linux/build
      - name: Archive
        run: |
          d="retro-wall-$GITHUB_REF_NAME-linux-x86_64"
          mkdir -p "$d/linux"
          sudo chown -R "$(id -u)" target
          cp target/release/retro-wall "$d/"
          cp -R themes examples LICENSE README.md EXTENDING.md CHANGELOG.md "$d/"
          cp -R linux/install linux/uninstall linux/lib "$d/linux/"
          tar czf "$d.tar.gz" "$d"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: retro-wall-*.tar.gz

  macos:
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - run: brew install meson ninja pkgconf
      - run: ci/macos/build-cairo-static ~/cairo-static
      - run: ci/macos/cargo build --release
      - name: Archive
        run: |
          d="retro-wall-$GITHUB_REF_NAME-macos-arm64"
          mkdir -p "$d"
          cp target/release/retro-wall "$d/"
          cp -R themes examples macos LICENSE README.md EXTENDING.md CHANGELOG.md "$d/"
          tar czf "$d.tar.gz" "$d"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: retro-wall-*.tar.gz

  windows:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t rwall-win ci/windows
      - run: ci/windows/cargo build --release
      - name: Archive
        run: |
          d="retro-wall-$GITHUB_REF_NAME-windows-x86_64"
          mkdir -p "$d"
          sudo chown -R "$(id -u)" target
          cp target/x86_64-pc-windows-gnu/release/retro-wall.exe "$d/"
          cp -R themes examples windows LICENSE README.md EXTENDING.md CHANGELOG.md "$d/"
          zip -qr "$d.zip" "$d"
      - name: The setup program, with the wall and its themes carried in it
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libcairo2-dev
          cargo run --release --example pack-setup -- target/x86_64-pc-windows-gnu/release/retro-wall-setup.exe \
            target/x86_64-pc-windows-gnu/release/retro-wall.exe themes "retro-wall-$GITHUB_REF_NAME-windows-setup.exe"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: |
            retro-wall-*.zip
            retro-wall-*-setup.exe

  release:
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: archives
          merge-multiple: true
      - name: The release, with the archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l archives
          # this version's section of CHANGELOG.md, without its heading
          awk -v v="## $GITHUB_REF_NAME" '/^## / { on = ($0 == v || index($0, v " ") == 1); next } on' CHANGELOG.md >notes.md
          (cd archives && sha256sum -- * >SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" archives/* --repo "$GITHUB_REPOSITORY" \
            --title "retro-wall $GITHUB_REF_NAME" --notes-file notes.md
