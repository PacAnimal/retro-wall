# forest: a forest seen at an isometric angle, painted as an old isometric role-playing game's maps were,
# laid out anew each time retro-wall starts: woods of oak, birch, pine, fir, beech, alder and willow in stands with clearings
# between, undergrowth, stones and logs, dirt paths, and a river that flows, a bridge or stepping stones where
# a path crosses it. No two copies of a picture stand close, nor at the same size near each other.
#
# It lives: the trees and the undergrowth bend in gusts, the clouds' shadows drift over, ducks paddle on
# the river and a trout leaps now and then, crows fly over, butterflies keep to the flowers, rabbits come
# out of their burrows, leaves fall and dust glints in the light. The pictures are beside this file: the ground,
# path and river bed textures (seamless, seen from above) and the things in sprites/, each standing on
# its foot at the bottom; trees of one species share the start of their names (oak1, oak-ancient).
# [element.woodland].seed = N keeps one forest.
format = 1                  # the theme format it is written for: EXTENDING.md, "What stays stable"
name = "Forest"

scene = ["woodland", "title", "instruments"]

[monitors]                  # a pure wallpaper: nothing over the scene. title = "rightmost" in retro.toml
title = "none"              # shows the hostname, in the lettering below
widgets = "none"
graph = "none"
status = "none"

[palette]                   # the forest's: its shade, its moss and its paths
base = "#2c3418"
shadow = "#1a200e"
deep = "#3a2a14"
ramp = ["#3c4a1c", "#56662a", "#7a8436", "#a89048", "#c8a868", "#e8d8a8"]
title_top = "#f0e4bc"
title_light = "#d8b878"
title_bottom = "#8a6230"
glow = "#c8a868"
caption = "#e8d8a8"
bracket = "#56662a"

[tweaks]                    # the lettering over the canopy: a deep shadow of the wood's shade, so it reads
title_corner = "top-right"
title_glow = [[8, 0.3]]
title_shadow = [4.0, 6.0, 4.0, 1.4, "#0a0e04"]
rule = false
ruler_end = 0.0

[element.woodland]
density = 35.0              # trees per square unit where the wood is thickest
brightness = 0.85           # every picture a little darker and duller than painted
saturation = 0.85
ground = "ground.png"
